[project]
name = "careeros-backend"
version = "0.1.0"
description = "CareerOS — Technical Career Intelligence Platform"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ── Web framework ────────────────────────────────────────────────
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.34.0",

    # ── Database ─────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # ── Validation & settings ────────────────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",

    # ── Auth ─────────────────────────────────────────────────────────
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Redis ────────────────────────────────────────────────────────
    "redis>=5.2.0",

    # ── Google Cloud ─────────────────────────────────────────────────
    "google-cloud-pubsub>=2.28.0",
    "google-cloud-storage>=2.19.0",

    # ── AI ───────────────────────────────────────────────────────────
    "google-cloud-aiplatform>=1.75.0",

    # ── Observability ────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── HTTP client (for GitHub API) ─────────────────────────────────
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "T20", # flake8-print
]
ignore = ["S101", "S105"]  # Allow assert and hardcoded passwords in tests/config

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
